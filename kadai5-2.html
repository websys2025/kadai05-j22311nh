<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>演習課題5-2：外部APIの呼び出しテスト</title>
</head>
<body>
    <h1 id="msg">何かのAPI</h1>
    <form name="apiform"><p>
        何かのフォーム：<input type="text" name="form_data">
        <button type="button" id="btn1" onclick="some_api(this.form)">実行</button>
    </p></form>
    
    <div id="result"></div>
    <script>
        async function some_api(myForm) {
            // ここにコードを書く
            const name = myForm.form_data.value.trim().toLowerCase();
            const url = `https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(name)}`;

            try {
                const res = await fetch(url);
                if (!res.ok) {
                    throw new Error('ポケモンが見つかりません');
                }
                const data = await res.json();

                const types = data.types.map(t => t.type.name).join(', ');
                const imgUrl = data.sprites.front_default || "";

                document.getElementById("result").innerHTML = `
                    <h2>${data.name} (ID: ${data.id})</h2>
                    <img src="${imgUrl}" alt="${data.name}">
                    <p>タイプ: ${types}</p>
                `;
            } catch (error) {
                document.getElementById("result").innerHTML = `<p style="color:red;">${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
